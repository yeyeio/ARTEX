name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge BaaRai/ARTEX main into fork main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and merge
        run: |
          git remote add upstream https://github.com/BaaRai/ARTEX.git
          git fetch upstream main
          git merge --no-edit --no-ff upstream/main

      - name: Push synchronized main
        run: git push origin HEAD:main
